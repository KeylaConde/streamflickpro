<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Pro - Panel de Vendedores</title>
    <link rel="icon" type="image/png" href="img/logo/Streamflick_black.png">

    <meta property="og:title" content="Streaming Pro - Tus plataformas favoritas" />
    <meta property="og:description" content="Accede a tus plataformas de streaming favoritas en un solo lugar. ¡Disfruta de la mejor experiencia de entretenimiento!" />
    <meta property="og:image" content="https://www.streamflickpro.online/img/logo/Streamflick (2)-compressed.png" />
    <meta property="og:url" content="https://streamflickpro.online" />
    <meta property="og:type" content=""website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Enlace al Manifest para la instalación PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Color de la barra de estado en móviles Android -->
    <meta name="theme-color" content="#f6d365">

    <!-- Soporte extra para que funcione perfecto en iPhone (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Streamflick">
    <link rel="apple-touch-icon" href="img/logo/Streamflick_black.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-container">
                <img src="img/logo/Streamflick (2)-compressed.png" alt="Logo Streamflick Pro" class="logo-icon">
                <div class="logo-text">Streamflick <span class="logo-pro"> PRO</span>
                </div>
                <!--p>Tus plataformas de streaming favoritas en un solo lugar ⚡</p-->
            </div>

            <div class="header-buttons">
                <button class="btn-ir-publico" onclick="irAVitrinaPublica()">
                    <i class="fa-solid fa-house"></i> Inicio
                </button>
                <button class="btn-acceso-vendedores" onclick="mostrarLogin()">Acceso Distribuidores 🔒</button>
            </div>
        </div>
    </header>

    <section id="seccion-publica" class="vitrina-container">

        <div class="menu-categorias-publico" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;">
            <div class="botones-grupo">
            <button class="btn-individual" onclick="filtrarVitrinaPublica('Individual')">Servicios</button>
            <button class="btn-duo" onclick="filtrarVitrinaPublica('Dúos')">Dúos</button>
            <button class="btn-trio" onclick="filtrarVitrinaPublica('Tríos')">Tríos</button>
            <button class="btn-combo" onclick="filtrarVitrinaPublica('Combos Especiales')">Combos Premium</button>
            </div>

            <div class="buscador-publico-container">
            <form class="search-box-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="buscador-publico" name="q" placeholder="¿Qué plataforma buscas? (Ej: Netflix, Amazon...)" oninput="buscarServiciosPublicos()" autocomplete="off" spellcheck="false">
            </form>
            </div>
        </div>

        <div id="grid-clientes" class="grid-servicios">
            <!-- Contenido de los clientes -->
        </div>
    </section>

    <div id="auth-container" style="display: none;">
        <div class="login-box">
            <h2>🔑 Acceso Privado</h2>
            <div class="input-group">
                <input type="email" id="login-email" placeholder="Correo electrónico">
                <input type="password" id="login-password" placeholder="Contraseña">
            </div>
            <button id="btn-login" onclick="login()">Entrar al Panel</button>
        </div>
    </div>

    <main id="main-content" style="display: none;">
        <div class="menu-categorias">
            <button class="btn-individual" onclick="filtrarPorCategoria('Individual')">Servicios</button>
            <button class="btn-duo" onclick="filtrarPorCategoria('Dúos')">Dúos</button>
            <button class="btn-trio" onclick="filtrarPorCategoria('Tríos')">Tríos</button>
            <button class="btn-combo" onclick="filtrarPorCategoria('Combos Especiales')">Combos Premium</button>
        </div>
        <section class="search-container">
            <input type="text" id="buscador" placeholder="Qué plataforma buscas? Ej: Disney...">
        </section>

        <!-- Contenido de los distribuidores -->
        <div id="servicios-container" class="grid-servicios">
            <p class="loading">Cargando servicios...</p>
        </div>
    </main>

    <footer class="firma-dev">
        <p>&copy; <span id="year"></span> Streamflick PRO. Todos los derechos reservados.</p>
        <p>Diseñado y programado por <span class="highlight-nombre">Keyla Conde</span></p>
    </footer>

    <div id="notificacion-venta" class="toast-venta" style="display:none;">
        <p id="texto-venta">Alguien acaba de comprar...</p>
    </div>
    
    <script src="app.js" charset="UTF-8"></script>
</body>
</html>
